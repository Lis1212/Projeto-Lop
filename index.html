<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carro 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

    <a-scene>
        <a-plane id="p1" position=" 0 0 -0"></a-plane>
        <a-plane id="p2" position=" 0 0 -60"></a-plane>
        <a-plane id="p3" position=" 0 0 -120"></a-plane>


        <a-sky color="#87ceeb"></a-sky>

        <!-- chão -->
        <a-plane
            color="#555"
            rotation="-90 0 0"
            position="0 0.01 0"
            width="12"
            height="200">
            </a-plane>

        
            <a-plane
            color="#555"
            rotation="-90 0 0"
            position="0 0.01 0"
            width="12"
            height="200">
            </a-plane>
            


        <!-- carro-->
        <a-entity id="carro" position="0 0.5 0" rotation="0 0 0">
            <a-box position="0 0.5 0" width="2" height="1" depth="4" color="#1565ff"></a-box>

            <a-box position="0 1.5 -0.5" width="2" height="1" depth="2" color="#0d47a1"></a-box>

            <a-cylinder position="1.1 0 1.5" radius="0.5" height="0.4" rotation="0 0 90" color="black"></a-cylinder>
            <a-cylinder position="-1.1 0 1.5" radius="0.5" height="0.4" rotation="0 0 90" color="black"></a-cylinder>
            <a-cylinder position="1.1 0 -1.5" radius="0.5" height="0.4" rotation="0 0 90" color="black"></a-cylinder>
            <a-cylinder position="-1.1 0 -1.5" radius="0.5" height="0.4" rotation="0 0 90" color="black"></a-cylinder>
        </a-entity>

        <!-- camera -->    
        <a-entity id="cameraRig" position="0 6 10">
            <a-camera look-controls-enabled="false"></a-camera>
        </a-entity>
    </a-scene>

  
<div id="controles">
    <button id="btnFrente">▲</button>
    <button id="btnEsquerda">◀</button>
    <button id="btnTras">▼</button>
    <button id="btnDireita">▶</button>
</div>


    <script src="script.js"></script>
</body>
</html
