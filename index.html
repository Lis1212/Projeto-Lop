<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carro 3D</title>

<link rel="stylesheet" href="style.css">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>

<body>

<a-scene>

<!-- biblioteca do cenario -->
<a-entity environment="
preset: forest;
groundColor: #5DBB63;
skyType: atmosphere;
dressingAmount: 250;
dressingScale: 2;
playArea: 55;
"></a-entity>



<!-- CARRO -->
<a-entity id="carro" position="0 0.5 0" rotation="0 90 0">

<!-- base -->
<a-box
position="0 0.5 0"
width="4"
height="1"
depth="2"
color="#1565ff">
</a-box>

<!-- teto do carro -->
<a-box
position="0 1.5 0"
width="2"
height="1"
depth="2"
color="#0d47a1">
</a-box>

<!-- rodas -->
<a-cylinder position="-1.5 0 1" radius="0.5" height="0.5" rotation="90 0 0" color="black"></a-cylinder>
<a-cylinder position="1.5 0 1" radius="0.5" height="0.5" rotation="90 0 0" color="black"></a-cylinder>
<a-cylinder position="-1.5 0 -1" radius="0.5" height="0.5" rotation="90 0 0" color="black"></a-cylinder>
<a-cylinder position="1.5 0 -1" radius="0.5" height="0.5" rotation="90 0 0" color="black"></a-cylinder>

</a-entity>

<!-- CÂMERA -->
<a-entity id="camera" position="0 6 14">
<a-camera></a-camera>
</a-entity>

</a-scene>

<script src="script.js"></script>

</body>
</html>>
